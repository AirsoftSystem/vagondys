
# .github/workflows/recalculate-stats.yml
name: Recalculate Stats

on:
  schedule:
    # Tous les dimanches à 3h du matin (UTC)
    - cron: '0 3 * * 0'
  # ✅ Permet de lancer manuellement depuis GitHub (Actions → Run workflow)
  workflow_dispatch:

jobs:
  recalculate:
    runs-on: ubuntu-latest
    steps:
      - name: Call API to recalculate stats
        run: |
          curl -X GET https://vagondys.com/api/cron/recalculate-stats \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
